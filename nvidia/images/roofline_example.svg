<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470">
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22"
        font-weight="700" fill="#111827">
    Worked Roofline Example
  </text>
  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="15"
        fill="#374151">
    P_peak = 4 GF/s, b_s = 10 GB/s, I_app = 0.25 flop/byte
  </text>

  <line x1="100" y1="350" x2="680" y2="350" stroke="#111827" stroke-width="2"/>
  <line x1="100" y1="350" x2="100" y2="80" stroke="#111827" stroke-width="2"/>
  <polygon points="680,350 668,344 668,356" fill="#111827"/>
  <polygon points="100,80 94,92 106,92" fill="#111827"/>

  <line x1="100" y1="110" x2="680" y2="110" stroke="#2563eb" stroke-width="3"/>
  <line x1="100" y1="350" x2="390" y2="110" stroke="#16a34a" stroke-width="4"/>
  <line x1="390" y1="110" x2="680" y2="110" stroke="#dc2626" stroke-width="5"/>

  <line x1="281" y1="350" x2="281" y2="200" stroke="#0ea5e9" stroke-width="2"
        stroke-dasharray="7 6"/>
  <line x1="100" y1="200" x2="281" y2="200" stroke="#0ea5e9" stroke-width="2"
        stroke-dasharray="7 6"/>
  <circle cx="281" cy="200" r="8" fill="#f59e0b" stroke="#111827" stroke-width="1"/>

  <line x1="390" y1="350" x2="390" y2="110" stroke="#6b7280" stroke-width="2"
        stroke-dasharray="7 6"/>
  <circle cx="390" cy="110" r="7" fill="#f59e0b" stroke="#111827" stroke-width="1"/>

  <text x="668" y="97" text-anchor="end" font-family="Arial, sans-serif" font-size="17"
        fill="#2563eb">P_peak = 4 GF/s</text>
  <text x="425" y="245" font-family="Arial, sans-serif" font-size="17" fill="#15803d">
    <tspan x="425" dy="0">bandwidth ceiling: P = I * b_s</tspan>
    <tspan x="425" dy="22">P = 10 * I GF/s when b_s = 10 GB/s</tspan>
  </text>
  <text x="296" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700"
        fill="#111827">P = 2.5 GF/s</text>
  <text x="281" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="15"
        fill="#111827">I_app = 0.25</text>
  <text x="390" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="15"
        fill="#111827">I_knee = 0.4</text>

  <text x="390" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18"
        fill="#111827">Computational intensity I, flop/byte</text>
  <text x="36" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18"
        fill="#111827" transform="rotate(-90 36 220)">Performance P, GF/s</text>

  <text x="92" y="355" text-anchor="end" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">0</text>
  <text x="92" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">2.5</text>
  <text x="92" y="115" text-anchor="end" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">4</text>
  <text x="100" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">0</text>
  <text x="680" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">0.8</text>

  <text x="500" y="190" font-family="Arial, sans-serif" font-size="15" fill="#374151">
    Since 0.25 &lt; 0.4, this point is bandwidth-bound.
  </text>
</svg>
