<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22"
        font-weight="700" fill="#111827">
    Naive Roofline Model
  </text>

  <line x1="90" y1="340" x2="650" y2="340" stroke="#111827" stroke-width="2"/>
  <line x1="90" y1="340" x2="90" y2="50" stroke="#111827" stroke-width="2"/>
  <polygon points="650,340 638,334 638,346" fill="#111827"/>
  <polygon points="90,50 84,62 96,62" fill="#111827"/>

  <line x1="90" y1="95" x2="650" y2="95" stroke="#2563eb" stroke-width="3"/>
  <line x1="90" y1="340" x2="370" y2="95" stroke="#16a34a" stroke-width="4"/>
  <line x1="370" y1="95" x2="650" y2="95" stroke="#dc2626" stroke-width="5"/>

  <line x1="370" y1="340" x2="370" y2="95" stroke="#6b7280" stroke-width="2"
        stroke-dasharray="7 6"/>
  <circle cx="370" cy="95" r="7" fill="#f59e0b" stroke="#111827" stroke-width="1"/>

  <text x="640" y="82" text-anchor="end" font-family="Arial, sans-serif" font-size="18"
        fill="#2563eb">
    compute ceiling: P_peak
  </text>
  <text x="420" y="185" font-family="Arial, sans-serif" font-size="18" fill="#15803d">
    bandwidth ceiling: P = I * b_s
  </text>
  <text x="392" y="128" font-family="Arial, sans-serif" font-size="16" fill="#111827">
    knee: I_knee = P_peak / b_s
  </text>

  <text x="370" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="18"
        fill="#111827">
    Computational intensity I
  </text>
  <text x="30" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18"
        fill="#111827" transform="rotate(-90 30 205)">
    Performance P
  </text>

  <text x="82" y="345" text-anchor="end" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">0</text>
  <text x="82" y="100" text-anchor="end" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">P_peak</text>
  <text x="90" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">0</text>
  <text x="370" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">knee</text>
  <text x="650" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="14"
        fill="#374151">higher I</text>
</svg>
