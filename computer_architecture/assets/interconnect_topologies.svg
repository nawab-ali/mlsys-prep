<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<title>Common interconnection topologies</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

<style>
  .t{font-family:Arial,Helvetica,sans-serif;fill:#111}
  .h{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:700}
  .b{fill:#f7f7f7;stroke:#222;stroke-width:1.7}
  .s{fill:#fff;stroke:#222;stroke-width:1.4}
  .a{fill:none;stroke:#222;stroke-width:1.7;marker-end:url(#arrow)}
  .d{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}
  .thin{fill:none;stroke:#444;stroke-width:1.2}
</style>

<text x="600" y="34" font-size="26" class="h" text-anchor="middle">Common Interconnection Topologies</text>
<text x="155" y="82" font-size="20" class="h" text-anchor="middle">Ring</text>
<circle cx="155" cy="150" r="20" class="s"/><text x="155" y="155" font-size="13" class="t" text-anchor="middle">0</text>
<circle cx="95" cy="205" r="20" class="s"/><text x="95" y="210" font-size="13" class="t" text-anchor="middle">1</text>
<circle cx="120" cy="285" r="20" class="s"/><text x="120" y="290" font-size="13" class="t" text-anchor="middle">2</text>
<circle cx="190" cy="285" r="20" class="s"/><text x="190" y="290" font-size="13" class="t" text-anchor="middle">3</text>
<circle cx="215" cy="205" r="20" class="s"/><text x="215" y="210" font-size="13" class="t" text-anchor="middle">4</text>
<line x1="155" y1="150" x2="95" y2="205" class="thin"/>
<line x1="95" y1="205" x2="120" y2="285" class="thin"/>
<line x1="120" y1="285" x2="190" y2="285" class="thin"/>
<line x1="190" y1="285" x2="215" y2="205" class="thin"/>
<line x1="215" y1="205" x2="155" y2="150" class="thin"/>
<text x="450" y="82" font-size="20" class="h" text-anchor="middle">2D mesh</text>
<circle cx="390" cy="150" r="18" class="s"/>
<line x1="408" y1="150" x2="432" y2="150" class="thin"/>
<line x1="390" y1="168" x2="390" y2="192" class="thin"/>
<circle cx="450" cy="150" r="18" class="s"/>
<line x1="468" y1="150" x2="492" y2="150" class="thin"/>
<line x1="450" y1="168" x2="450" y2="192" class="thin"/>
<circle cx="510" cy="150" r="18" class="s"/>
<line x1="510" y1="168" x2="510" y2="192" class="thin"/>
<circle cx="390" cy="210" r="18" class="s"/>
<line x1="408" y1="210" x2="432" y2="210" class="thin"/>
<line x1="390" y1="228" x2="390" y2="252" class="thin"/>
<circle cx="450" cy="210" r="18" class="s"/>
<line x1="468" y1="210" x2="492" y2="210" class="thin"/>
<line x1="450" y1="228" x2="450" y2="252" class="thin"/>
<circle cx="510" cy="210" r="18" class="s"/>
<line x1="510" y1="228" x2="510" y2="252" class="thin"/>
<circle cx="390" cy="270" r="18" class="s"/>
<line x1="408" y1="270" x2="432" y2="270" class="thin"/>
<circle cx="450" cy="270" r="18" class="s"/>
<line x1="468" y1="270" x2="492" y2="270" class="thin"/>
<circle cx="510" cy="270" r="18" class="s"/>
<text x="760" y="82" font-size="20" class="h" text-anchor="middle">Fat tree</text>
<circle cx="760" cy="145" r="18" class="s"/>
<circle cx="690" cy="215" r="18" class="s"/>
<circle cx="830" cy="215" r="18" class="s"/>
<circle cx="650" cy="295" r="18" class="s"/>
<circle cx="720" cy="295" r="18" class="s"/>
<circle cx="800" cy="295" r="18" class="s"/>
<circle cx="870" cy="295" r="18" class="s"/>
<line x1="748" y1="158" x2="702" y2="202" style="stroke:#222;stroke-width:5"/>
<line x1="772" y1="158" x2="818" y2="202" style="stroke:#222;stroke-width:5"/>
<line x1="690" y1="233" x2="650" y2="277" style="stroke:#222;stroke-width:2.3"/>
<line x1="690" y1="233" x2="720" y2="277" style="stroke:#222;stroke-width:2.3"/>
<line x1="830" y1="233" x2="800" y2="277" style="stroke:#222;stroke-width:2.3"/>
<line x1="830" y1="233" x2="870" y2="277" style="stroke:#222;stroke-width:2.3"/>
<text x="760" y="330" font-size="13" class="t" text-anchor="middle">more bandwidth toward the root</text>
<text x="1040" y="82" font-size="20" class="h" text-anchor="middle">Crossbar</text>
<line x1="970" y1="135" x2="970" y2="305" class="thin"/>
<line x1="945" y1="155" x2="1095" y2="155" class="thin"/>
<line x1="1015" y1="135" x2="1015" y2="305" class="thin"/>
<line x1="945" y1="200" x2="1095" y2="200" class="thin"/>
<line x1="1060" y1="135" x2="1060" y2="305" class="thin"/>
<line x1="945" y1="245" x2="1095" y2="245" class="thin"/>
<line x1="1105" y1="135" x2="1105" y2="305" class="thin"/>
<line x1="945" y1="290" x2="1095" y2="290" class="thin"/>

<text x="600" y="395" font-size="15" class="h" text-anchor="middle">Key metrics: latency, throughput, bisection bandwidth, hop count, radix, cost, and energy.</text>
<text x="600" y="430" font-size="15" class="t" text-anchor="middle">Routing may be deterministic, oblivious, or adaptive; flow control manages buffers and backpressure.</text>
<text x="600" y="465" font-size="15" class="t" text-anchor="middle">Meshes map well to 2D chips; rings are simple; crossbars are fast but scale poorly in wiring/area.</text>
<rect x="300" y="510" width="600" height="70" rx="8" class="b"/>
<text x="600" y="552" font-size="17" class="t" text-anchor="middle">Package-scale fabrics: chiplets + UCIe; coherent expansion/fabrics: CXL.</text>
</svg>
