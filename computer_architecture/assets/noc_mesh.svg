<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780">
<title>Mesh NoC with attached agents</title>
<desc>Nine routers; each endpoint attaches through its own local network interface (NI).</desc>
