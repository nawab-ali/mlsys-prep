<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<title>Bufferless deflection: two flits, one desired output</title>
<desc>A wins C -&gt; D. B is redirected east, then reaches D through SE.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24343d}</style>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#24343d"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2267a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f7a"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34939"/></marker>
</defs>
<text x="32" y="42" font-size="28" text-anchor="start" font-weight="700" style="fill:#24343d">Bufferless deflection: two flits, one desired output</text>
<text x="32" y="73" font-size="17" text-anchor="start" font-weight="400" style="fill:#24343d">A wins C -&gt; D. B is redirected east, then reaches D through SE.</text>
<path d="M32 94 H968" fill="none" stroke="#dce4e8" stroke-width="1"/>
<path d="M190 170 H810" fill="none" stroke="#c3cdd2" stroke-width="3"/>
<path d="M190 335 H810" fill="none" stroke="#c3cdd2" stroke-width="3"/>
<path d="M190 500 H810" fill="none" stroke="#c3cdd2" stroke-width="3"/>
<path d="M190 170 V500" fill="none" stroke="#c3cdd2" stroke-width="3"/>
<path d="M500 170 V500" fill="none" stroke="#c3cdd2" stroke-width="3"/>
<path d="M810 170 V500" fill="none" stroke="#c3cdd2" stroke-width="3"/>
<path d="M220 335 H465" fill="none" stroke="#2267a5" stroke-width="2.3" marker-end="url(#blue)"/>
<path d="M500 367 V465" fill="none" stroke="#2267a5" stroke-width="2.3" marker-end="url(#blue)"/>
<path d="M500 201 V300" fill="none" stroke="#b34939" stroke-width="2.3" marker-end="url(#red)"/>
