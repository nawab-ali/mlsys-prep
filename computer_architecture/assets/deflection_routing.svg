<path d="M775 500 H535" fill="none" stroke="#b34939" stroke-width="2.3" marker-end="url(#red)"/>
<circle cx="190" cy="170" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="190" y="176.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">NW</text>
<circle cx="500" cy="170" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="500" y="176.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">N</text>
<circle cx="810" cy="170" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="810" y="176.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">NE</text>
<circle cx="190" cy="335" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="190" y="341.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">W</text>
<circle cx="500" cy="335" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="500" y="341.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">C</text>
<circle cx="810" cy="335" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="810" y="341.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">E</text>
<circle cx="190" cy="500" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="190" y="506.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">SW</text>
<circle cx="500" cy="500" r="28" fill="#e7f5f2" stroke="#087f7a" stroke-width="2"/>
<text x="500" y="506.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">D</text>
<circle cx="810" cy="500" r="28" fill="#f4f6f7" stroke="#24343d" stroke-width="2"/>
<text x="810" y="506.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">SE</text>
<text x="340" y="317" font-size="18" text-anchor="middle" font-weight="400" style="fill:#2267a5">A arrives</text>
<text x="520" y="256" font-size="18" text-anchor="start" font-weight="400" style="fill:#b34939">B arrives</text>
<text x="650" y="317" font-size="18" text-anchor="middle" font-weight="400" style="fill:#b34939">B deflected</text>
<text x="480" y="420" font-size="18" text-anchor="end" font-weight="400" style="fill:#2267a5">A wins</text>
<text x="40" y="572" font-size="19" text-anchor="start" font-weight="400" style="fill:#24343d">Routes span successive hops; later outputs are assumed free.</text>
<text x="40" y="608" font-size="18" text-anchor="start" font-weight="400" style="fill:#24343d">No input queue at the contested router; link/pipeline registers still hold flits.</text>
</svg>
