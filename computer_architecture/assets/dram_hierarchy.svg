<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
<title>Inside a DDR-style memory system</title>
<desc>Containment and selection hierarchy; not a physical floorplan.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24343d}</style>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#24343d"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2267a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f7a"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34939"/></marker>
</defs>
<text x="32" y="42" font-size="28" text-anchor="start" font-weight="700" style="fill:#24343d">Inside a DDR-style memory system</text>
<text x="32" y="73" font-size="17" text-anchor="start" font-weight="400" style="fill:#24343d">Containment and selection hierarchy; not a physical floorplan.</text>
<path d="M32 94 H968" fill="none" stroke="#dce4e8" stroke-width="1"/>
<rect x="48" y="125" width="320" height="68" rx="5" fill="#eaf2fb" stroke="#2267a5" stroke-width="1.6"/>
<text x="208.0" y="165.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Channel / subchannel</text>
<text x="400" y="165" font-size="18" text-anchor="start" font-weight="400" style="fill:#24343d">Independent command and data interface</text>
<path d="M208 193 V220" fill="none" stroke="#24343d" stroke-width="2.3" marker-end="url(#ink)"/>
<rect x="48" y="221" width="320" height="68" rx="5" fill="#e7f5f2" stroke="#087f7a" stroke-width="1.6"/>
<text x="208.0" y="261.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Rank</text>
<text x="400" y="261" font-size="18" text-anchor="start" font-weight="400" style="fill:#24343d">Devices selected together supply the data width</text>
<path d="M208 289 V316" fill="none" stroke="#24343d" stroke-width="2.3" marker-end="url(#ink)"/>
<rect x="48" y="317" width="320" height="68" rx="5" fill="#eaf2fb" stroke="#2267a5" stroke-width="1.6"/>
<text x="208.0" y="357.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">DRAM device</text>
<text x="400" y="357" font-size="18" text-anchor="start" font-weight="400" style="fill:#24343d">One chip contributes a subset of the data bits</text>
<path d="M208 385 V412" fill="none" stroke="#24343d" stroke-width="2.3" marker-end="url(#ink)"/>
<rect x="48" y="413" width="320" height="68" rx="5" fill="#e7f5f2" stroke="#087f7a" stroke-width="1.6"/>
<text x="208.0" y="453.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Bank group / bank</text>
<text x="400" y="453" font-size="18" text-anchor="start" font-weight="400" style="fill:#24343d">Grouping and timing depend on the DRAM generation</text>
<path d="M208 481 V508" fill="none" stroke="#24343d" stroke-width="2.3" marker-end="url(#ink)"/>
<rect x="48" y="509" width="320" height="68" rx="5" fill="#eaf2fb" stroke="#2267a5" stroke-width="1.6"/>
<text x="208.0" y="549.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Row buffer + cell array</text>
<text x="400" y="549" font-size="18" text-anchor="start" font-weight="400" style="fill:#24343d">ACT opens a row; RD/WR selects columns; PRE closes it</text>
<text x="48" y="615" font-size="18" text-anchor="start" font-weight="400" style="fill:#24343d">Banks can overlap work, but commands and the channel data bus are shared.</text>
</svg>
