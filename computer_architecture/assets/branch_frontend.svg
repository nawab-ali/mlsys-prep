<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="1000" height="456" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect x="0" y="0" width="900" height="410" fill="white" /><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155" /></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8" /></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b" /></marker>
  </defs>
  <rect width="900" height="410" fill="#ffffff" />

  <text x="24" y="28" font-size="14" fill="#64748b" font-weight="bold">BRANCH TARGET BUFFER LOOKUP</text>


  <text x="94" y="92" text-anchor="middle" font-size="14" fill="#64748b">Program counter</text>
  <rect x="24" y="100" width="140" height="46" rx="5" fill="#e0e7ff" stroke="#334155" stroke-width="1.8" />
  <text x="94" y="130" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace">0x100c</text>

  <line x1="164" y1="123" x2="236" y2="123" stroke="#334155" stroke-width="1.7" marker-end="url(#a)" />
  <text x="200" y="114" text-anchor="middle" font-size="14" fill="#475569">Index</text>


  <text x="400" y="66" text-anchor="middle" font-size="14" fill="#64748b" font-weight="bold">Branch target buffer</text>
  <rect x="240" y="74" width="320" height="152" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.8" />
  <line x1="240" y1="102" x2="560" y2="102" stroke="#94a3b8" stroke-width="1.3" />
  <line x1="380" y1="74" x2="380" y2="226" stroke="#94a3b8" stroke-width="1.2" />
  <text x="310" y="94" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Tag</text>
  <text x="470" y="94" text-anchor="middle" font-size="14" fill="#334155" font-weight="bold">Target</text>

  <rect x="242" y="110" width="316" height="26" fill="#f1f5f9" />
  <text x="310" y="128" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="DejaVu Sans Mono, Consolas, monospace">0x2a</text>
  <text x="470" y="128" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="DejaVu Sans Mono, Consolas, monospace">0x3080</text>

  <rect x="242" y="138" width="316" height="26" fill="#fde68a" />
  <text x="310" y="156" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace">0x10</text>
  <text x="470" y="156" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace">0x2040</text>

  <text x="310" y="184" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="DejaVu Sans Mono, Consolas, monospace">0x7c</text>
  <text x="470" y="184" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="DejaVu Sans Mono, Consolas, monospace">0x1180</text>
  <text x="310" y="212" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="DejaVu Sans Mono, Consolas, monospace">0x05</text>
  <text x="470" y="212" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="DejaVu Sans Mono, Consolas, monospace">0x2c00</text>

  <text x="400" y="248" text-anchor="middle" font-size="14" fill="#64748b" font-style="italic">Compare the selected tag with the upper PC bits.</text>


  <path d="M 560 151 L 640 151" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#aB)" />
  <text x="600" y="142" text-anchor="middle" font-size="14" fill="#1d4ed8" font-weight="bold">Tag hit</text>
  <text x="600" y="168" text-anchor="middle" font-size="14" fill="#1d4ed8">Target</text>


  <rect x="240" y="300" width="140" height="42" rx="5" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
  <text x="310" y="327" text-anchor="middle" font-size="14" fill="#0f172a">PC + length</text>
  <path d="M 94 146 L 94 321 L 236 321" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aG)" />
  <path d="M 380 321 L 640 321" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#aG)" />
  <text x="510" y="312" text-anchor="middle" font-size="14" fill="#64748b" font-weight="bold">Tag miss / not taken</text>


  <rect x="644" y="120" width="46" height="222" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.8" />
  <text x="667" y="362" text-anchor="middle" font-size="14" fill="#334155">Mux</text>

  <line x1="690" y1="231" x2="762" y2="231" stroke="#334155" stroke-width="1.9" marker-end="url(#a)" />
  <text x="812" y="212" text-anchor="middle" font-size="14" fill="#64748b">Next PC</text>
  <rect x="766" y="220" width="110" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8" />
  <text x="821" y="249" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace">0x2040</text>

  <text x="24" y="376" font-size="14" fill="#64748b">At fetch: use the target on a tag hit when the branch is predicted taken.</text>
  <text x="24" y="394" font-size="14" fill="#64748b">Otherwise continue sequentially. Direction, return prediction, and updates are not shown.</text>
<metadata>Branch target buffer lookup tr.svg; Oğuz Ergin; CC BY-SA 4.0; https://commons.wikimedia.org/wiki/File:Branch_target_buffer_lookup_tr.svg; https://creativecommons.org/licenses/by-sa/4.0 Modifications: English translation, generic PC increment, direction-prediction caveat, background and sizing.</metadata></svg>
