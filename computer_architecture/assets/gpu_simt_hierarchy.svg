<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<title>CUDA grid block warp thread hierarchy</title><rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#111}
.h{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:700}
.b{fill:#f7f7f7;stroke:#222;stroke-width:1.7}
.s{fill:#fff;stroke:#222;stroke-width:1.4}
.a{fill:none;stroke:#222;stroke-width:1.7;marker-end:url(#arrow)}
.d{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}
.thin{fill:none;stroke:#444;stroke-width:1.2}
</style>

<text x="600" y="34" font-size="26" class="h" text-anchor="middle">CUDA Thread Hierarchy and SIMT Execution</text>
<rect x="500" y="70" width="200" height="62" rx="8" class="b"/>
<text x="600" y="108" font-size="20" class="h" text-anchor="middle">Grid (kernel launch)</text>
<rect x="120" y="190" width="210" height="72" rx="8" class="b"/>
<text x="225" y="233" font-size="19" class="h" text-anchor="middle">Block 0</text>
<rect x="495" y="190" width="210" height="72" rx="8" class="b"/>
<text x="600" y="233" font-size="19" class="h" text-anchor="middle">Block 1</text>
<rect x="870" y="190" width="210" height="72" rx="8" class="b"/>
<text x="975" y="233" font-size="19" class="h" text-anchor="middle">Block 2</text>
<line x1="550" y1="132" x2="255" y2="190" class="a"/>
<line x1="600" y1="132" x2="600" y2="190" class="a"/>
<line x1="650" y1="132" x2="945" y2="190" class="a"/>
<text x="600" y="298" font-size="15" class="h" text-anchor="middle">Inside Block 1</text>
<rect x="300" y="330" width="190" height="62" rx="8" class="b"/>
<text x="395" y="368" font-size="18" class="h" text-anchor="middle">Warp 0</text>
<rect x="505" y="330" width="190" height="62" rx="8" class="b"/>
<text x="600" y="368" font-size="18" class="h" text-anchor="middle">Warp 1</text>
<rect x="710" y="330" width="190" height="62" rx="8" class="b"/>
<text x="805" y="368" font-size="18" class="h" text-anchor="middle">Warp 2</text>
<line x1="565" y1="262" x2="395" y2="330" class="a"/>
<line x1="600" y1="262" x2="600" y2="330" class="a"/>
<line x1="635" y1="262" x2="805" y2="330" class="a"/>
<text x="600" y="428" font-size="15" class="h" text-anchor="middle">Inside Warp 1</text>
<rect x="340" y="455" width="80" height="56" rx="7" class="s"/>
<text x="380" y="489" font-size="16" class="t" text-anchor="middle">T0</text>
<line x1="600" y1="392" x2="380" y2="455" class="a"/>
<rect x="440" y="455" width="80" height="56" rx="7" class="s"/>
<text x="480" y="489" font-size="16" class="t" text-anchor="middle">T1</text>
<line x1="600" y1="392" x2="480" y2="455" class="a"/>
<rect x="540" y="455" width="80" height="56" rx="7" class="s"/>
<text x="580" y="489" font-size="16" class="t" text-anchor="middle">T2</text>
<line x1="600" y1="392" x2="580" y2="455" class="a"/>
<rect x="640" y="455" width="80" height="56" rx="7" class="s"/>
<text x="680" y="489" font-size="16" class="t" text-anchor="middle">...</text>
<rect x="740" y="455" width="80" height="56" rx="7" class="s"/>
<text x="780" y="489" font-size="16" class="t" text-anchor="middle">T30</text>
<line x1="600" y1="392" x2="780" y2="455" class="a"/>
<rect x="840" y="455" width="80" height="56" rx="7" class="s"/>
<text x="880" y="489" font-size="16" class="t" text-anchor="middle">T31</text>
<line x1="600" y1="392" x2="880" y2="455" class="a"/>

<text x="600" y="560" font-size="15" class="h" text-anchor="middle">Blocks schedule independently to SMs; each block is partitioned into sibling 32-thread warps.</text>
<text x="600" y="592" font-size="15" class="t" text-anchor="middle">Threads have per-thread state; warp issue is common, while divergence uses per-thread masks/state.</text>
<text x="600" y="624" font-size="15" class="t" text-anchor="middle">CUDA warp size is 32 threads; many resident warps help hide latency.</text>
</svg>
