  <text x="450" y="322" font-size="14" fill="#64748b">Concatenate two bits from each input.</text>
  <text x="24" y="376" font-size="13" fill="#0f172a" font-weight="bold">gshare 4/4</text>
  <rect x="150" y="358" width="72" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8" />
  <text x="186" y="376" text-anchor="middle" font-size="13" fill="#1e3a8a" font-family="DejaVu Sans Mono, Consolas, monospace">0110</text>
