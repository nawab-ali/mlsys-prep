  <text x="24" y="424" font-size="14" fill="#64748b">Gselect concatenates PC and history bits. Gshare mixes them using XOR.</text>
  <text x="24" y="444" font-size="14" fill="#64748b">Four-bit indexing addresses 16 counters; only a few entries are illustrated.</text>
