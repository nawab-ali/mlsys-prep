  <rect x="246" y="358" width="72" height="26" rx="3" fill="#dbeafe" stroke="#1d4ed8" />
  <text x="282" y="376" text-anchor="middle" font-size="13" fill="#1e3a8a" font-family="DejaVu Sans Mono, Consolas, monospace">1011</text>
