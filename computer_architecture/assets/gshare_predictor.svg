<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590">
<title>Gshare branch predictor</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

<style>
  .t{font-family:Arial,Helvetica,sans-serif;fill:#111}
  .h{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:700}
  .b{fill:#f7f7f7;stroke:#222;stroke-width:1.7}
  .s{fill:#fff;stroke:#222;stroke-width:1.4}
  .a{fill:none;stroke:#222;stroke-width:1.7;marker-end:url(#arrow)}
  .d{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrow)}
  .thin{fill:none;stroke:#444;stroke-width:1.2}
</style>

<text x="590" y="34" font-size="26" class="h" text-anchor="middle">gshare: Global-History Correlated Branch Prediction</text>
<rect x="70" y="155" width="180" height="72" rx="8" class="b"/>
<text x="160" y="198" font-size="18" class="h" text-anchor="middle">Branch PC bits</text>
<rect x="70" y="315" width="180" height="82" rx="8" class="b"/>
<text x="160" y="349" font-size="17" class="h" text-anchor="middle">Global history</text>
<text x="160" y="374" font-size="14" class="t" text-anchor="middle">recent T / NT outcomes</text>
<circle cx="350" cy="270" r="42" class="b"/>
<text x="350" y="278" font-size="23" class="h" text-anchor="middle">XOR</text>
<rect x="470" y="190" width="250" height="160" rx="8" class="b"/>
<text x="595" y="225" font-size="18" class="h" text-anchor="middle">Pattern history table</text>
<text x="595" y="252" font-size="14" class="t" text-anchor="middle">indexed by PC XOR GHR</text>
<text x="595" y="285" font-size="14" class="t" text-anchor="middle">2-bit saturating counter</text>
<text x="595" y="316" font-size="14" class="t" text-anchor="middle">... many entries ...</text>
<rect x="825" y="210" width="210" height="110" rx="8" class="b"/>
<text x="930" y="250" font-size="18" class="h" text-anchor="middle">Direction prediction</text>
<text x="930" y="282" font-size="15" class="t" text-anchor="middle">taken / not taken</text>
<line x1="250" y1="191" x2="324" y2="246" class="a"/>
<line x1="250" y1="356" x2="324" y2="294" class="a"/>
<line x1="392" y1="270" x2="470" y2="270" class="a"/>
<line x1="720" y1="270" x2="825" y2="270" class="a"/>
<rect x="805" y="420" width="250" height="82" rx="8" class="b"/>
<text x="930" y="454" font-size="17" class="h" text-anchor="middle">Branch resolves</text>
<text x="930" y="480" font-size="14" class="t" text-anchor="middle">actual outcome</text>
<path d="M930 420 C850 375 760 345 690 330" class="d"/>
<path d="M805 461 C575 555 270 515 190 397" class="d"/>
<text x="770" y="385" font-size="13" class="t" text-anchor="middle">update selected counter</text>
<text x="455" y="520" font-size="13" class="t" text-anchor="middle">shift actual outcome into GHR</text>
<text x="590" y="565" font-size="14" class="t" text-anchor="middle">gshare correlates a branch with recent global outcomes while XOR helps distribute aliases across the table.</text>
</svg>
