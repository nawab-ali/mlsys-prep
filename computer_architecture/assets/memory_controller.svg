<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<title>Memory controller: select legal work</title>
<desc>Scheduling considers both DRAM efficiency and service guarantees.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#24343d}</style>
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#24343d"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2267a5"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f7a"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b34939"/></marker>
</defs>
<text x="32" y="42" font-size="28" text-anchor="start" font-weight="700" style="fill:#24343d">Memory controller: select legal work</text>
<text x="32" y="73" font-size="17" text-anchor="start" font-weight="400" style="fill:#24343d">Scheduling considers both DRAM efficiency and service guarantees.</text>
<path d="M32 94 H968" fill="none" stroke="#dce4e8" stroke-width="1"/>
<rect x="40" y="145" width="205" height="78" rx="5" fill="#f4f6f7" stroke="#71818a" stroke-width="1.6"/>
<text x="142.5" y="177.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Core / LLC</text>
<text x="142.5" y="203.65" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24343d">memory requests</text>
<rect x="305" y="145" width="270" height="78" rx="5" fill="#eaf2fb" stroke="#2267a5" stroke-width="1.6"/>
<text x="440.0" y="177.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Address mapping</text>
<text x="440.0" y="203.65" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24343d">rank / bank / row</text>
<rect x="640" y="145" width="300" height="78" rx="5" fill="#eaf2fb" stroke="#2267a5" stroke-width="1.6"/>
<text x="790.0" y="177.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Read and write queues</text>
<text x="790.0" y="203.65" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24343d">pending requests</text>
<path d="M245 184 H305" fill="none" stroke="#24343d" stroke-width="2.3" marker-end="url(#ink)"/>
<path d="M575 184 H640" fill="none" stroke="#24343d" stroke-width="2.3" marker-end="url(#ink)"/>
<rect x="640" y="315" width="300" height="84" rx="5" fill="#e7f5f2" stroke="#087f7a" stroke-width="1.6"/>
<text x="790.0" y="350.3" font-size="18" text-anchor="middle" font-weight="700" style="fill:#24343d">Scheduler + timing checks</text>
<text x="790.0" y="376.3" font-size="18" text-anchor="middle" font-weight="400" style="fill:#24343d">ready commands / QoS</text>
<path d="M790 223 V315" fill="none" stroke="#24343d" stroke-width="2.3" marker-end="url(#ink)"/>
<rect x="305" y="315" width="270" height="84" rx="5" fill="#e7f5f2" stroke="#087f7a" stroke-width="1.6"/>
<text x="440.0" y="350.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">Issue command</text>
<text x="440.0" y="376.65" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24343d">ACT / RD / WR / PRE</text>
<path d="M640 357 H575" fill="none" stroke="#087f7a" stroke-width="2.3" marker-end="url(#teal)"/>
<rect x="40" y="315" width="205" height="84" rx="5" fill="#f4f6f7" stroke="#71818a" stroke-width="1.6"/>
<text x="142.5" y="350.65" font-size="19" text-anchor="middle" font-weight="700" style="fill:#24343d">DRAM</text>
<text x="142.5" y="376.65" font-size="19" text-anchor="middle" font-weight="400" style="fill:#24343d">banks + data bus</text>
<path d="M305 357 H245" fill="none" stroke="#087f7a" stroke-width="2.3" marker-end="url(#teal)"/>
<path d="M140 399 V444 H790 V399" fill="none" stroke="#2267a5" stroke-width="2.3" marker-end="url(#blue)" stroke-dasharray="7 5"/>
<text x="440" y="435" font-size="17" text-anchor="middle" font-weight="400" style="fill:#2267a5">Bank state and timing constrain the next issue</text>
<text x="40" y="500" font-size="19" text-anchor="start" font-weight="400" style="fill:#24343d">FR-FCFS favors ready row hits; age and fairness policies limit starvation.</text>
<text x="40" y="531" font-size="17" text-anchor="start" font-weight="400" style="fill:#24343d">Command path shown. Returning data and refresh scheduling are omitted.</text>
</svg>
