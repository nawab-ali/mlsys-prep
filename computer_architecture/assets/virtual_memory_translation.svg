<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500">
<title>Virtual address translation</title>
<rect width="100%" height="100%" fill="#fff" data-background="true"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

<style>
  .t { font-family: Arial, Helvetica, sans-serif; fill: #111; }
  .h { font-family: Arial, Helvetica, sans-serif; fill: #111; font-weight: 700; }
  .b { fill: #f7f7f7; stroke: #222; stroke-width: 1.5; }
  .a { fill: none; stroke: #222; stroke-width: 1.6; marker-end: url(#arrow); }
  .d { fill: none; stroke: #555; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .s { fill: #fff; stroke: #222; stroke-width: 1.2; }
</style>

<text x="540" y="30" font-size="24" class="h" text-anchor="middle">Virtual Address Translation</text>
<rect x="40" y="115" width="170" height="70" rx="6" class="b"/>
<text x="125.0" y="146.6" font-size="17" class="t" text-anchor="middle">CPU</text>
<text x="125.0" y="165.3" font-size="17" class="t" text-anchor="middle">virtual address</text>
<rect x="280" y="70" width="180" height="70" rx="6" class="b"/>
<text x="370.0" y="101.8" font-size="16" class="t" text-anchor="middle">TLB</text>
<text x="370.0" y="119.4" font-size="16" class="t" text-anchor="middle">VPN -&gt; PFN</text>
<rect x="280" y="210" width="180" height="85" rx="6" class="b"/>
<text x="370.0" y="249.5" font-size="15" class="t" text-anchor="middle">Page-table walker</text>
<text x="370.0" y="266.0" font-size="15" class="t" text-anchor="middle">multilevel tables</text>
<rect x="545" y="115" width="180" height="70" rx="6" class="b"/>
<text x="635.0" y="155.95" font-size="17" class="t" text-anchor="middle">Physical address</text>
<rect x="810" y="115" width="210" height="70" rx="6" class="b"/>
<text x="915.0" y="155.95" font-size="17" class="t" text-anchor="middle">Cache / memory</text>
<line x1="210" y1="150" x2="280" y2="105" class="a"/>
<line x1="460" y1="105" x2="545" y2="145" class="a"/>
<line x1="725" y1="150" x2="810" y2="150" class="a"/>
<path d="M370 140 L370 210" class="d"/>
<line x1="460" y1="252" x2="545" y2="170" class="a"/>
<text x="370" y="175" font-size="12" class="h" text-anchor="middle">TLB miss</text>
<text x="370" y="330" font-size="14" class="t" text-anchor="middle">If PTE is valid/present: fill TLB and retry.</text>
<text x="370" y="355" font-size="14" class="t" text-anchor="middle">If mapping is absent or protection fails: raise a page fault.</text>
<text x="540" y="435" font-size="14" class="h" text-anchor="middle">TLB miss != page fault. A hardware page walk can satisfy a TLB miss without OS intervention.</text>
<text x="540" y="462" font-size="14" class="t" text-anchor="middle">Page offset is unchanged by translation; the VPN maps to a physical frame number.</text>
</svg>
