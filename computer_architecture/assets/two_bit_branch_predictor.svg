<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
<title>Two-bit saturating counter branch predictor</title>
<rect width="100%" height="100%" fill="#fff" data-background="true"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

<style>
  .t { font-family: Arial, Helvetica, sans-serif; fill: #111; }
  .h { font-family: Arial, Helvetica, sans-serif; fill: #111; font-weight: 700; }
  .b { fill: #f7f7f7; stroke: #222; stroke-width: 1.5; }
  .a { fill: none; stroke: #222; stroke-width: 1.6; marker-end: url(#arrow); }
  .d { fill: none; stroke: #555; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .s { fill: #fff; stroke: #222; stroke-width: 1.2; }
</style>

<text x="430" y="30" font-size="24" class="h" text-anchor="middle">2-bit Saturating Counter</text>
<circle cx="150" cy="150" r="58" class="b"/>
<text x="150" y="145" font-size="18" class="h" text-anchor="middle">SNT</text>
<text x="150" y="168" font-size="12" class="t" text-anchor="middle">Strongly / not taken</text>
<circle cx="350" cy="150" r="58" class="b"/>
<text x="350" y="145" font-size="18" class="h" text-anchor="middle">WNT</text>
<text x="350" y="168" font-size="12" class="t" text-anchor="middle">Weakly / not taken</text>
<circle cx="510" cy="150" r="58" class="b"/>
<text x="510" y="145" font-size="18" class="h" text-anchor="middle">WT</text>
<text x="510" y="168" font-size="12" class="t" text-anchor="middle">Weakly / taken</text>
<circle cx="710" cy="150" r="58" class="b"/>
<text x="710" y="145" font-size="18" class="h" text-anchor="middle">ST</text>
<text x="710" y="168" font-size="12" class="t" text-anchor="middle">Strongly / taken</text>
<line x1="208" y1="135" x2="290" y2="135" class="a"/>
<text x="250" y="120" font-size="13" class="h" text-anchor="middle">T</text>
<line x1="408" y1="135" x2="450" y2="135" class="a"/>
<text x="430" y="120" font-size="13" class="h" text-anchor="middle">T</text>
<line x1="568" y1="135" x2="650" y2="135" class="a"/>
<text x="610" y="120" font-size="13" class="h" text-anchor="middle">T</text>
<line x1="652" y1="175" x2="570" y2="175" class="a"/>
<text x="610" y="199" font-size="13" class="h" text-anchor="middle">NT</text>
<line x1="452" y1="175" x2="410" y2="175" class="a"/>
<text x="430" y="199" font-size="13" class="h" text-anchor="middle">NT</text>
<line x1="292" y1="175" x2="210" y2="175" class="a"/>
<text x="250" y="199" font-size="13" class="h" text-anchor="middle">NT</text>
<path d="M120 100 C70 65 70 235 120 205" class="a"/>
<text x="58" y="150" font-size="13" class="h" text-anchor="middle">NT</text>
<path d="M740 100 C790 65 790 235 740 205" class="a"/>
<text x="802" y="150" font-size="13" class="h" text-anchor="middle">T</text>
<text x="430" y="305" font-size="15" class="h" text-anchor="middle">Prediction: SNT/WNT -&gt; not taken; WT/ST -&gt; taken.</text>
<text x="430" y="335" font-size="14" class="t" text-anchor="middle">Hysteresis avoids flipping prediction after one atypical outcome.</text>
<text x="430" y="370" font-size="14" class="t" text-anchor="middle">A behavior reversal from a strong state usually needs two opposite outcomes</text>
<text x="430" y="392" font-size="14" class="t" text-anchor="middle">before the predicted direction changes.</text>
</svg>
