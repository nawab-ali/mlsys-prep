<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540">
<title>HBM stack organization</title>
<rect width="100%" height="100%" fill="#fff" data-background="true"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

<style>
  .t { font-family: Arial, Helvetica, sans-serif; fill: #111; }
  .h { font-family: Arial, Helvetica, sans-serif; fill: #111; font-weight: 700; }
  .b { fill: #f7f7f7; stroke: #222; stroke-width: 1.5; }
  .a { fill: none; stroke: #222; stroke-width: 1.6; marker-end: url(#arrow); }
  .d { fill: none; stroke: #555; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .s { fill: #fff; stroke: #222; stroke-width: 1.2; }
</style>

<text x="490" y="28" font-size="24" class="h" text-anchor="middle">High-Bandwidth Memory: Wide, Stacked DRAM</text>
<rect x="315" y="90" width="350" height="42" rx="6" class="b"/>
<text x="490.0" y="116.25" font-size="15" class="t" text-anchor="middle">DRAM die</text>
<rect x="315" y="145" width="350" height="42" rx="6" class="b"/>
<text x="490.0" y="171.25" font-size="15" class="t" text-anchor="middle">DRAM die</text>
<rect x="315" y="200" width="350" height="42" rx="6" class="b"/>
<text x="490.0" y="226.25" font-size="15" class="t" text-anchor="middle">DRAM die</text>
<rect x="315" y="255" width="350" height="42" rx="6" class="b"/>
<text x="490.0" y="281.25" font-size="15" class="t" text-anchor="middle">DRAM die</text>
<rect x="315" y="310" width="350" height="42" rx="6" class="b"/>
<text x="490.0" y="336.25" font-size="15" class="t" text-anchor="middle">Logic / base die</text>
<line x1="370" y1="90" x2="370" y2="352" stroke="#222" stroke-width="3"/>
<text x="370" y="375" font-size="11" class="t" text-anchor="middle">TSV</text>
<line x1="430" y1="90" x2="430" y2="352" stroke="#222" stroke-width="3"/>
<text x="430" y="375" font-size="11" class="t" text-anchor="middle">TSV</text>
<line x1="490" y1="90" x2="490" y2="352" stroke="#222" stroke-width="3"/>
<text x="490" y="375" font-size="11" class="t" text-anchor="middle">TSV</text>
<line x1="550" y1="90" x2="550" y2="352" stroke="#222" stroke-width="3"/>
<text x="550" y="375" font-size="11" class="t" text-anchor="middle">TSV</text>
<line x1="610" y1="90" x2="610" y2="352" stroke="#222" stroke-width="3"/>
<text x="610" y="375" font-size="11" class="t" text-anchor="middle">TSV</text>
<line x1="490" y1="352" x2="490" y2="410" stroke="#222" stroke-width="3"/>
<text x="520" y="392" font-size="11" class="t">microbumps / package links</text>
<rect x="260" y="410" width="460" height="55" rx="6" class="b"/>
<text x="490.0" y="443.1" font-size="16" class="t" text-anchor="middle">Interposer / advanced package</text>
<rect x="50" y="410" width="150" height="55" rx="6" class="b"/>
<text x="125.0" y="442.75" font-size="15" class="t" text-anchor="middle">GPU / accelerator</text>
<line x1="200" y1="437" x2="260" y2="437" class="a"/>
<text x="835" y="130" font-size="15" class="h" text-anchor="middle">Many channels</text>
<text x="835" y="160" font-size="14" class="t" text-anchor="middle">very wide interface</text>
<text x="835" y="190" font-size="14" class="t" text-anchor="middle">short package traces</text>
<text x="835" y="220" font-size="14" class="t" text-anchor="middle">high bandwidth / watt</text>
<text x="490" y="510" font-size="14" class="h" text-anchor="middle">HBM4 doubles the data interface to 2048 bits versus HBM3/HBM3E's 1024 bits.</text>
</svg>
