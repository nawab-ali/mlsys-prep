<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580"
     role="img" aria-labelledby="title description">
  <title id="title">Six-instruction dataflow dependency graph</title>
  <desc id="description">Independent x, b, and c operations feed a and y, then the final result d.
    Arrows carry x from x to a, b and c to y, and a and y to d.</desc>
  <rect width="1000" height="580" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#374151"/>
    </marker>
  </defs>
  <g fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)">
    <path id="edge-x-a" d="M 170 166 V 276"/>
    <path id="edge-b-y" d="M 500 166 V 220 H 630 V 276"/>
    <path id="edge-c-y" d="M 830 166 V 220 H 700 V 276"/>
    <path id="edge-a-d" d="M 170 368 V 414 H 420 V 452"/>
    <path id="edge-y-d" d="M 665 368 V 414 H 580 V 452"/>
  </g>
  <g stroke-width="1.5">
    <rect id="node-x" x="50" y="74" width="240" height="92" rx="4" fill="#e7f3ea" stroke="#4c7c5b"/>
    <rect id="node-b" x="380" y="74" width="240" height="92" rx="4" fill="#eaf0f8" stroke="#527298"/>
    <rect id="node-c" x="710" y="74" width="240" height="92" rx="4" fill="#eaf0f8" stroke="#527298"/>
    <rect id="node-a" x="50" y="276" width="240" height="92" rx="4" fill="#eaf0f8" stroke="#527298"/>
    <rect id="node-y" x="545" y="276" width="240" height="92" rx="4" fill="#e7f3ea" stroke="#4c7c5b"/>
    <rect id="node-d" x="340" y="452" width="320" height="92" rx="4" fill="#fff1d6" stroke="#947427"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#20252b" text-anchor="middle">
    <text x="500" y="36" font-size="24" font-weight="600">Six-instruction dataflow dependency graph</text>
    <g font-size="18" font-weight="600">
      <text x="170" y="108">MUL: x (R3)</text>
      <text x="500" y="108">ADD: b (R7)</text>
      <text x="830" y="108">ADD: c (R10)</text>
      <text x="170" y="310">ADD: a (R5, first value)</text>
      <text x="665" y="310">MUL: y (R11)</text>
      <text x="500" y="486">ADD: d (R5, final value)</text>
    </g>
    <g font-size="20">
      <text x="170" y="142">x = R1 * R2</text>
      <text x="500" y="142">b = R2 + R6</text>
      <text x="830" y="142">c = R8 + R9</text>
      <text x="170" y="344">a = x + R4</text>
      <text x="665" y="344">y = b * c</text>
      <text x="500" y="520">d = a + y</text>
    </g>
    <g font-size="18">
      <text x="193" y="226">x</text>
      <text x="518" y="200">b</text>
      <text x="810" y="200">c</text>
      <text x="285" y="402">a</text>
      <text x="620" y="402">y</text>
    </g>
  </g>
</svg>
