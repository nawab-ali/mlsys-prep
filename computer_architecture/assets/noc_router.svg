<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<title>Typical packet-switched network-on-chip router</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#222"/>
  </marker>
</defs>
<style>
  .t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:700}
  .b{fill:#f7f7f7;stroke:#222;stroke-width:1.5}.a{fill:none;stroke:#222;stroke-width:1.6;marker-end:url(#arrow)}
</style>
<text x="550" y="34" font-size="25" class="h" text-anchor="middle">Typical Input-Buffered NoC Router</text>

<rect x="50" y="190" width="160" height="125" rx="7" class="b"/>
<text x="130" y="220" font-size="17" class="h" text-anchor="middle">Input ports</text>
<text x="130" y="250" font-size="14" class="t" text-anchor="middle">N / E / S / W / Local</text>
<text x="130" y="280" font-size="14" class="t" text-anchor="middle">VC input buffers</text>

<rect x="260" y="190" width="160" height="125" rx="7" class="b"/>
<text x="340" y="225" font-size="17" class="h" text-anchor="middle">Route compute</text>
<text x="340" y="257" font-size="14" class="t" text-anchor="middle">choose legal output(s)</text>
<text x="340" y="285" font-size="14" class="t" text-anchor="middle">from destination</text>

<rect x="470" y="190" width="160" height="125" rx="7" class="b"/>
<text x="550" y="225" font-size="17" class="h" text-anchor="middle">VC allocation</text>
<text x="550" y="257" font-size="14" class="t" text-anchor="middle">reserve downstream</text>
<text x="550" y="285" font-size="14" class="t" text-anchor="middle">virtual channel</text>

<rect x="680" y="190" width="160" height="125" rx="7" class="b"/>
<text x="760" y="225" font-size="17" class="h" text-anchor="middle">Switch allocation</text>
<text x="760" y="257" font-size="14" class="t" text-anchor="middle">arbitrate input-to-output</text>
<text x="760" y="285" font-size="14" class="t" text-anchor="middle">crossbar requests</text>

<rect x="890" y="145" width="160" height="90" rx="7" class="b"/>
<text x="970" y="182" font-size="18" class="h" text-anchor="middle">Crossbar</text>
<text x="970" y="210" font-size="14" class="t" text-anchor="middle">one flit transfer</text>

<rect x="890" y="275" width="160" height="90" rx="7" class="b"/>
<text x="970" y="312" font-size="18" class="h" text-anchor="middle">Output ports</text>
<text x="970" y="340" font-size="14" class="t" text-anchor="middle">N / E / S / W / Local</text>

<path d="M210 252 L260 252" class="a"/>
<path d="M420 252 L470 252" class="a"/>
<path d="M630 252 L680 252" class="a"/>
<path d="M840 230 L890 190" class="a"/>
<path d="M970 235 L970 275" class="a"/>

<text x="550" y="410" font-size="15" class="h" text-anchor="middle">Flow control is separate from routing.</text>
<text x="550" y="442" font-size="14" class="t" text-anchor="middle">
Credits/backpressure prevent buffer overflow; virtual channels multiplex logical queues on one physical link.
</text>
<text x="550" y="474" font-size="14" class="t" text-anchor="middle">
Wormhole routing moves packets as flits; a blocked head flit can hold resources across multiple routers.
</text>
<text x="550" y="506" font-size="14" class="t" text-anchor="middle">
Pipeline stages may be combined, bypassed, or reordered in a real high-performance router.
</text>
</svg>
