<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510">
<title>Memory prefetching</title>
<rect width="100%" height="100%" fill="#fff" data-background="true"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>

<style>
  .t { font-family: Arial, Helvetica, sans-serif; fill: #111; }
  .h { font-family: Arial, Helvetica, sans-serif; fill: #111; font-weight: 700; }
  .b { fill: #f7f7f7; stroke: #222; stroke-width: 1.5; }
  .a { fill: none; stroke: #222; stroke-width: 1.6; marker-end: url(#arrow); }
  .d { fill: none; stroke: #555; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow); }
  .s { fill: #fff; stroke: #222; stroke-width: 1.2; }
</style>

<text x="550" y="28" font-size="24" class="h" text-anchor="middle">Prefetching: Predict Future Memory Accesses</text>
<rect x="50" y="120" width="170" height="70" rx="6" class="b"/>
<text x="135.0" y="151.79999999999998" font-size="16" class="t" text-anchor="middle">Demand stream</text>
<text x="135.0" y="169.39999999999998" font-size="16" class="t" text-anchor="middle">A, A+N, A+2N...</text>
<rect x="300" y="85" width="210" height="75" rx="6" class="b"/>
<text x="405.0" y="119.5" font-size="15" class="t" text-anchor="middle">Pattern detector</text>
<text x="405.0" y="136.0" font-size="15" class="t" text-anchor="middle">next-line / stride / stream</text>
<rect x="300" y="220" width="210" height="75" rx="6" class="b"/>
<text x="405.0" y="254.5" font-size="15" class="t" text-anchor="middle">Address-correlation</text>
<text x="405.0" y="271.0" font-size="15" class="t" text-anchor="middle">/ signature predictor</text>
<rect x="610" y="145" width="180" height="80" rx="6" class="b"/>
<text x="700.0" y="181.79999999999998" font-size="16" class="t" text-anchor="middle">Prefetch queue</text>
<text x="700.0" y="199.39999999999998" font-size="16" class="t" text-anchor="middle">+ throttle</text>
<rect x="880" y="145" width="170" height="80" rx="6" class="b"/>
<text x="965.0" y="181.79999999999998" font-size="16" class="t" text-anchor="middle">Cache or</text>
<text x="965.0" y="199.39999999999998" font-size="16" class="t" text-anchor="middle">prefetch buffer</text>
<line x1="220" y1="155" x2="300" y2="122" class="a"/>
<line x1="220" y1="155" x2="300" y2="257" class="a"/>
<line x1="510" y1="122" x2="610" y2="175" class="a"/>
<line x1="510" y1="257" x2="610" y2="190" class="a"/>
<line x1="790" y1="185" x2="880" y2="185" class="a"/>
<text x="550" y="360" font-size="14" class="h" text-anchor="middle">Accuracy = useful prefetches / issued prefetches</text>
<text x="550" y="388" font-size="14" class="t" text-anchor="middle">Coverage = misses eliminated / baseline misses</text>
<text x="550" y="416" font-size="14" class="t" text-anchor="middle">Timeliness: arrive before demand, but not so early that data is evicted.</text>
<text x="550" y="444" font-size="14" class="t" text-anchor="middle">Watch bandwidth, cache pollution, contention, and over-aggressive prefetch distance.</text>
</svg>
