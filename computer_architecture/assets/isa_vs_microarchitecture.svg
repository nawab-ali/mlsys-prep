<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
<title>ISA versus microarchitecture</title>
<rect width="100%" height="100%" fill="#fff" data-background="true"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-family:Arial,Helvetica,sans-serif;fill:#111;font-weight:700}
.b{fill:#f7f7f7;stroke:#222;stroke-width:1.5}.a{fill:none;stroke:#222;stroke-width:1.6;marker-end:url(#arrow)}
</style>
<text x="450" y="35" font-size="24" class="h" text-anchor="middle">Software / Hardware Contract</text>
<rect x="285" y="70" width="330" height="42" rx="6" class="b"/>
<text x="450" y="97" font-size="17" class="t" text-anchor="middle">Applications</text>
<rect x="285" y="125" width="330" height="42" rx="6" class="b"/>
<text x="450" y="152" font-size="17" class="t" text-anchor="middle">Compilers / runtimes</text>
<rect x="285" y="180" width="330" height="42" rx="6" class="b"/>
<text x="450" y="207" font-size="17" class="t" text-anchor="middle">ISA</text>
<rect x="285" y="250" width="330" height="42" rx="6" class="b"/>
<text x="450" y="277" font-size="17" class="t" text-anchor="middle">Microarchitecture</text>
<rect x="285" y="320" width="330" height="42" rx="6" class="b"/>
<text x="450" y="347" font-size="17" class="t" text-anchor="middle">Logic / circuits</text>
<rect x="285" y="390" width="330" height="42" rx="6" class="b"/>
<text x="450" y="417" font-size="17" class="t" text-anchor="middle">Devices</text>
<text x="165" y="190" font-size="15" class="h" text-anchor="middle">Architectural contract</text>
<text x="165" y="215" font-size="14" class="t" text-anchor="middle">instructions, registers,</text>
<text x="165" y="235" font-size="14" class="t" text-anchor="middle">memory model, exceptions</text>
<path d="M245 210 C260 210 270 205 285 205" class="a"/>
<text x="735" y="265" font-size="15" class="h" text-anchor="middle">Implementation choices</text>
<text x="735" y="290" font-size="14" class="t" text-anchor="middle">pipeline, OoO, caches,</text>
<text x="735" y="310" font-size="14" class="t" text-anchor="middle">prefetching, predictors</text>
<path d="M650 285 C638 285 628 271 615 271" class="a"/>
<text x="450" y="448" font-size="15" class="h" text-anchor="middle">Same ISA can have many microarchitectures.</text>
</svg>